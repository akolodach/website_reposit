<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="product.css">
</head>
<body>
    <div class="container">


    <header class="header">
        <nav class="layout_head">
            <ul>
                <li>
                    <div class="logo">
                        <a href="index.html">
                            <img src="img/logo dog.png" alt="Логотип" class="header-img"> 
                        </a>
                    </div>
                </li>
                <li>
                    <div class="search-container">
                        <input type="text" class="search_cont" placeholder="Пошук...">
                        <button class="search-btn">Знайти</button>
                    </div>
                </li>
                <li>
                    <div class="header-icons">
                        <img src="img/basket.png" alt="Кошик" class="icon-img">
                    </div>
                </li>
                 <li>
                    <div class="header-icons"> 
                        <a href="user.html"><img src="img/user.png" alt="Профіль" class="icon-img"></a>
                    </div>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container2">
        <section class="product-page">
            <div class="product-main-info">
                <div class="product-image-container">
                    <img src="img/Rectangle 52.png" alt="Їжа для песиків" class="main-img">
                </div>

                <div class="product-actions">
                    <h1>Лежак для собаки</h1>
                    <div class="rating">★★★★★</div>
                    <button class="review-btn">Відгук</button>
                    
                    <div class="price-tag">250 грн</div>
                    
                    <button class="add-to-cart">Додати до кошика</button>
                </div>
            </div>

            <article class="product-description">
                <h2>Опис товару</h2>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Смачний та корисний корм для вашого улюбленця, що містить всі необхідні вітаміни.</p>
            </article>
        </section>
    </main>

    </div>
    
</body>
</html>
